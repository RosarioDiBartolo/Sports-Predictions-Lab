[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-odds-lab"
version = "0.1.0"
description = "Analisi modulare della calibrazione delle quote storiche 1-X-2."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "plotly>=5.20",
  "rapidfuzz>=3.14",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pandas-stubs>=2.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
odds-lab = "football_odds.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp --cov=football_odds --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/football_odds/market/research.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["football_odds"]
exclude = ["notebooks"]
ignore_missing_imports = true
disable_error_code = [
  "assignment",
  "attr-defined",
  "call-overload",
  "no-any-return",
]
